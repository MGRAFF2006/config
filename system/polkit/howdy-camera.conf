# Managed by Documents/config/scripts/install-howdy-polkit.py.
# Keep the helper's private /dev and closed device policy. Expose only Howdy's
# configured capture device; an absent camera must still allow password auth.
# pam_faillock opens an existing tally read-write even to check it, so the
# read-only system view (ProtectSystem=strict) would turn every check after a
# failed login into an error. Only the configured tally directory is writable.
[Service]
BindPaths=-@BIND_CAMERA@
DeviceAllow=@CAMERA@ rw
ReadWritePaths=-@TALLY_DIR@
