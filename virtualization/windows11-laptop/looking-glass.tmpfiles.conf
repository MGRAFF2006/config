# Shared frames: the desktop user and QEMU can read/write; other users cannot.
f /dev/shm/looking-glass-windows11 0660 humunkulud libvirt-qemu -
# Give the desktop user access to the QEMU-created local SPICE socket by ACL.
d /run/windows11-looking-glass 0770 humunkulud libvirt-qemu -
a+ /run/windows11-looking-glass - - - - d:u:humunkulud:rwx
