# Keep the Bluetooth audio link alive and finish A2DP when the headset
# is already on another host (Sennheiser-style multipoint).
# Switch to wideband HFP while the headset microphone is in use.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        # Finish A2DP when only GATT/partial profiles connected.
        # Do not auto-connect HFP — that is what failed with "Host is down".
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
        bluez5.hw-volume = [ a2dp_sink a2dp_source ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input.*" }
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        # Default 5s suspend drops A2DP; the phone then keeps the slot
        # and the next play on this machine has nothing to switch to.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
