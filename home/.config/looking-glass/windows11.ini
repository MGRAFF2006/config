[lgmp]
shmDevice=/dev/shm/looking-glass-windows11

[win]
title=Windows 11
appId=windows11-looking-glass
size=1920x1200
fullScreen=yes
setGuestRes=yes

[input]
; Right Ctrl opens the menu/releases captured input; Left Ctrl works normally.
escapeKey=97
captureOnFocus=no
autoCapture=no
; Hyprland reserves workspace shortcuts and Super+Q; other commands go to Windows.
grabKeyboard=yes
grabKeyboardOnFocus=yes
ignoreWindowsKeys=no

[clipboard]
toVM=yes
toLocal=yes

[spice]
enable=yes
host=/run/windows11-looking-glass/spice.sock
port=0
input=yes
clipboard=yes
audio=yes
usbAudio=no
