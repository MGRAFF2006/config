[lgmp]
shmDevice=/dev/shm/looking-glass-windows11

[win]
title=Windows 11
appId=windows11-looking-glass
size=1920x1200
fullScreen=no
setGuestRes=yes

[input]
; Right Ctrl opens the menu/releases captured input; Left Ctrl works normally.
escapeKey=97
captureOnFocus=no
autoCapture=no
; Keep Linux window controls available until Right Ctrl explicitly captures input.
grabKeyboard=yes
grabKeyboardOnFocus=no
; Never open Windows Start when using Linux Super shortcuts or dragging the viewer.
ignoreWindowsKeys=yes

[clipboard]
toVM=yes
toLocal=yes

[spice]
enable=yes
host=/run/windows11-looking-glass/spice.sock
port=0
input=yes
clipboard=yes
audio=yes
usbAudio=no
