# Rofi Snippets Configuration
# Format: trigger | description | content (or URL for quicklinks)
# Lines starting with # are comments
# Use \n for newlines in content

## Email & Identity
email | Personal Email | your@email.com

## Dev Shortcuts
shebang | Bash Shebang | #!/usr/bin/env bash\nset -euo pipefail
todo | TODO Comment | // TODO: 
fixme | FIXME Comment | // FIXME: 
log | Console Log | console.log()
pdb | Python Debugger | import pdb; pdb.set_trace()

## Quicklinks (URLs open in browser)
gh | GitHub | https://github.com
yt | YouTube | https://youtube.com
gpt | ChatGPT | https://chat.openai.com
arch | Arch Wiki | https://wiki.archlinux.org
aur | AUR Packages | https://aur.archlinux.org
nixpkgs | Nix Packages | https://search.nixos.org/packages
docker-hub | Docker Hub | https://hub.docker.com

## System Commands (output copied to clipboard)
ip | Public IP Address | curl -s ifconfig.me
date | ISO Date | date +%Y-%m-%d
ts | Unix Timestamp | date +%s
uuid | Generate UUID | cat /proc/sys/kernel/random/uuid
